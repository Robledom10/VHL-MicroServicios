server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:
        # =========================================================
        # AUTH SERVICE
        # =========================================================
        - id: auth-service
          uri: http://railway.internal
          predicates:
            - Path=/api/auth/**,/api/admin/**,/api/roles/**

        # =========================================================
        # RESERVATION SERVICE
        # =========================================================
        - id: reservation-service
          uri: http://railway.internal
          predicates:
            - Path=/api/v1/reservas/**,/api/v1/viajeros/**,/api/v1/confirmaciones/**

        # =========================================================
        # TOURIST CATALOG SERVICE
        # =========================================================
        - id: tourist-catalog-service
          uri: http://railway.internal
          predicates:
            - Path=/api/categorias/**,/api/paquetes/**,/api/proveedores/**

        # =========================================================
        # GALLERY SERVICE
        # =========================================================
        - id: gallery-service
          uri: http://railway.internal
          predicates:
            - Path=/api/media/**

        # =========================================================
        # FINANCIAL SERVICE
        # =========================================================
        - id: financial-service
          uri: http://railway.internal
          predicates:
            - Path=/api/payments/**,/api/webhook/**

        # =========================================================
        # OPERATION SERVICE
        # =========================================================
        - id: operation_service
          uri: http://railway.internal
          predicates:
            - Path=/api/v1/operaciones/**

      # =========================================================
      # CORS
      # =========================================================
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:4200"
              - "https://*.vercel.app" # Opcional: Descomenta o cambia por la URL de tu frontend real
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      # =========================================================
      # DEFAULT FILTERS
      # =========================================================
      default-filters:
        - name: DedupeResponseHeader
          args:
            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
            strategy: RETAIN_UNIQUE

# =========================================================
# JWT
# =========================================================
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION}
