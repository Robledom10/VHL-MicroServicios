server:
  port: ${FINANCIAL_SERVICE_PORT:8085}

spring:
  application:
    name: financial-service

  datasource:
    url: jdbc:mysql://localhost:${FINANCIAL_DB_PORT:3310}/${FINANCIAL_DB_NAME:pago_db}?useSSL=false&serverTimezone=UTC
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

# 💳 WOMPI CONFIG
wompi:
  base-url: https://sandbox.wompi.co/v1
  public-key: ${WOMPI_PUBLIC_KEY}
  private-key: ${WOMPI_PRIVATE_KEY}
  redirect-url: http://localhost:${FINANCIAL_SERVICE_PORT:8085}/api/payments/redirect

# 🔐 JWT (si luego proteges endpoints internos/webhooks)
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:900000}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
