services:
  # =========================================================
  # AUTH DATABASE
  # =========================================================
  db-auth:
    image: mysql:8
    container_name: db-auth
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AUTH_DB_NAME}
    ports:
      - "${AUTH_DB_PORT}:3306"
    volumes:
      - auth_data:/var/lib/mysql
      - ./Docker/auth_service.sql:/docker-entrypoint-initdb.d/auth_service.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-net

  # =========================================================
  # RESERVATION DATABASE
  # =========================================================
  db-reservation:
    image: mysql:8
    container_name: db-reservation
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${RESERVATION_DB_NAME}
    ports:
      - "${RESERVATION_DB_PORT}:3306"
    volumes:
      - reservation_data:/var/lib/mysql
      - ./Docker/reservation_service.sql:/docker-entrypoint-initdb.d/reservation_service.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-net

  # =========================================================
  # TOURIST CATALOG DATABASE
  # =========================================================
  db-catalog:
    image: mysql:8
    container_name: db-catalog
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${CATALOG_DB_NAME}
    ports:
      - "${CATALOG_DB_PORT}:3306"
    volumes:
      - catalog_data:/var/lib/mysql
      - ./Docker/tourist-catalog.sql:/docker-entrypoint-initdb.d/tourist-catalog.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-net

  # =========================================================
  # GALLERY DATABASE (MONGODB)
  # =========================================================
  db-gallery:
    image: mongo:7
    container_name: db-gallery
    restart: always
    ports:
      - "${GALLERY_MONGO_DB_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${GALLERY_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${GALLERY_MONGO_PASSWORD}
    volumes:
      - gallery_data:/data/db
      - ./Docker/gallery-init.js:/docker-entrypoint-initdb.d/gallery-init.js
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - microservices-net

      # =========================================================
  # FINANCIAL DATABASE
  # =========================================================
  db-financial:
    image: mysql:8
    container_name: db-financial
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${FINANCIAL_DB_NAME}

    ports:
      - "${FINANCIAL_DB_PORT}:3306"

    volumes:
      - financial_data:/var/lib/mysql
      - ./Docker/pago_db.sql:/docker-entrypoint-initdb.d/pago_db.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

    networks:
      - microservices-net

  # =========================================================
  # OPERATION DATABASE
  # =========================================================
  db-operation:
    image: mysql:8
    container_name: db-operation
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${OPERATION_DB_NAME}
    ports:
      - "${OPERATION_DB_PORT}:3306"
    volumes:
      - operation_data:/var/lib/mysql
      - ./Docker/operation_service.sql:/docker-entrypoint-initdb.d/operation_service.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-net

  # =========================================================
  # DOCUMENTS DATABASE
  # =========================================================
  db-documents:
    image: mysql:8
    container_name: db-documents
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DOCUMENTS_DB_NAME}
    ports:
      - "${DOCUMENTS_DB_PORT}:3306"
    volumes:
      - documents_data:/var/lib/mysql
      - ./Docker/gestion_documental_db.sql:/docker-entrypoint-initdb.d/gestion_documental_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-net

  # =========================================================
  # AUTH SERVICE
  # =========================================================
  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    depends_on:
      db-auth:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://db-auth:3306/${AUTH_DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION}

      GOOGLE_ID_CLIENT: ${GOOGLE_ID_CLIENT}
      GOOGLE_SECRET_CLIENT: ${GOOGLE_SECRET_CLIENT}
    ports:
      - "${AUTH_SERVICE_PORT}:8081"
    networks:
      - microservices-net

  # =========================================================
  # RESERVATION SERVICE
  # =========================================================
  reservation-service:
    build: ./reservation-service
    container_name: reservation-service
    restart: always
    depends_on:
      db-reservation:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-reservation:3306/${RESERVATION_DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${RESERVATION_SERVICE_PORT}:8082"
    networks:
      - microservices-net

  # =========================================================
  # TOURIST CATALOG SERVICE
  # =========================================================
  tourist-catalog-service:
    build: ./tourist-catalog-service
    container_name: tourist-catalog-service
    restart: always
    depends_on:
      db-catalog:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-catalog:3306/catalogo_turistico_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${TOURIST_CATALOG_SERVICE_PORT}:8083"
    networks:
      - microservices-net

  # =========================================================
  # GALLERY SERVICE
  # =========================================================
  gallery-service:
    build: ./gallery-service
    container_name: gallery-service
    restart: always
    depends_on:
      db-gallery:
        condition: service_healthy
    environment:
      - SERVER_PORT=8084
      - SPRING_DATA_MONGODB_URI=mongodb://root:root@db-gallery:27017/gallery_db?authSource=admin
      - SPRING_DATA_MONGODB_HOST=db-gallery
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=gallery_db
      - SPRING_DATA_MONGODB_USERNAME=root
      - SPRING_DATA_MONGODB_PASSWORD=root
      - SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE=admin
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    ports:
      - "${GALLERY_SERVICE_PORT}:8084"
    networks:
      - microservices-net

  # =========================================================
  # FINANCIAL SERVICE
  # =========================================================
  financial-service:
    build: ./financial-service

    container_name: financial-service

    restart: always

    depends_on:
      db-financial:
        condition: service_healthy

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: dev

      SPRING_DATASOURCE_URL: jdbc:mysql://db-financial:3306/${FINANCIAL_DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY}

    ports:
      - "${FINANCIAL_SERVICE_PORT}:8085"

    networks:
      - microservices-net

  # =========================================================
  # OPERATION SERVICE
  # =========================================================
  operation-service:
    build: ./operation-service
    container_name: operation-service
    restart: always
    depends_on:
      db-operation:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:mysql://db-operation:3306/${OPERATION_DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${OPERATION_SERVICE_PORT}:8086"
    networks:
      - microservices-net

  # =========================================================
  # DOCUMENT SERVICE
  # =========================================================
  document-service:
    build: ./documents-service
    container_name: document-service
    restart: always
    depends_on:
      db-documents:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:mysql://db-documents:3306/${DOCUMENTS_DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${DOCUMENTS_SERVICE_PORT}:8087"
    volumes:
      - documents_uploads:/app/uploads
    networks:
      - microservices-net

  # =========================================================
  # API GATEWAY
  # =========================================================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    depends_on:
      - auth-service
      - reservation-service
      - tourist-catalog-service
      - gallery-service
      - operation-service
      - financial-service
      - document-service
    env_file:
      - .env
    environment:
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION}
    ports:
      - "${API_GATEWAY_PORT}:8080"
    networks:
      - microservices-net

# =========================================================
# NETWORKS
# =========================================================
networks:
  microservices-net:

# =========================================================
# VOLUMES
# =========================================================
volumes:
  auth_data:
  reservation_data:
  catalog_data:
  gallery_data:
  operation_data:
  financial_data:
  documents_data:
  documents_uploads:
