services:

  db-auth:
    image: mysql:8
    container_name: auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${AUTH_DB_NAME}
    ports:
      - "${AUTH_DB_PORT}:3306"
    volumes:
      - auth_data:/var/lib/mysql
      - ./Docker/auth_service.sql:/docker-entrypoint-initdb.d/auth_service.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-net

  db-reservation:
    image: mysql:8
    container_name: db-reservation
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${RESERVATION_DB_NAME}
    ports:
      - "${RESERVATION_DB_PORT}:3306"
    volumes:
      - reservation_data:/var/lib/mysql
      - ./Docker/reservation_service.sql:/docker-entrypoint-initdb.d/reservation_service.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-net

  db-catalog:
    image: mysql:8
    container_name: db-catalog
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${CATALOG_DB_NAME}
    ports:
      - "${CATALOG_DB_PORT}:3306"
    volumes:
      - catalog_data:/var/lib/mysql
      - ./Docker/trip_operations_db.sql:/docker-entrypoint-initdb.d/trip_operations_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - microservices-net

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    depends_on:
      db-auth: # <-- Cambiado de 'mysql' a 'db-auth'
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://db-auth:3306/${AUTH_DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root # Usamos root ya que es el que tiene password definido
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION}
    ports:
      - "${AUTH_SERVICE_PORT}:8081"
    networks:
      - microservices-net

  reservation-service:
    build: ./reservation-service
    container_name: reservation-service
    restart: always
    depends_on:
      db-reservation: # <-- Cambiado de 'mysql' a 'db-reservation'
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-reservation:3306/${RESERVATION_DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${RESERVATION_SERVICE_PORT}:8082"
    networks:
      - microservices-net

  tourist-catalog-service:
    build: ./tourist-catalog-service
    container_name: tourist-catalog-service
    restart: always
    depends_on:
      db-catalog:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-catalog:3306/${CATALOG_DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${TOURIST_CATALOG_SERVICE_PORT}:8083"
    networks:
      - microservices-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    depends_on:
      - auth-service
      - reservation-service
      - tourist-catalog-service
    env_file:
      - .env
    environment:
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION}
    ports:
      - "${API_GATEWAY_PORT}:8080"
    networks:
      - microservices-net

networks:
  microservices-net:

volumes:
  auth_data:
  reservation_data:
  catalog_data:
