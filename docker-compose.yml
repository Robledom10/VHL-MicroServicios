services:

  db-auth:
    image: mysql:8
    container_name: db-auth
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - ./Docker/auth_service.sql:/docker-entrypoint-initdb.d/auth_service.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-net

  db-reservation:
    image: mysql:8
    container_name: db-reservation
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reservation_db
    ports:
      - "3308:3306"
    volumes:
      - ./Docker/reservation_service.sql:/docker-entrypoint-initdb.d/reservation_service.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-net

  db-operation:
    image: mysql:8
    container_name: db-operation
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trip_operations_db
    ports:
      - "3309:3306"
    volumes:
      - ./Docker/operation_service.sql:/docker-entrypoint-initdb.d/operation_service.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - microservices-net

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    depends_on:
      db-auth:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-auth:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8081:8081"
    networks:
      - microservices-net

  reservation-service:
    build: ./reservation-service
    container_name: reservation-service
    restart: always
    depends_on:
      db-reservation:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-reservation:3306/reservation_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8082:8082"
    networks:
      - microservices-net

  operation-service:
    build: ./operation-service
    container_name: operation-service
    restart: always
    depends_on:
      db-operation:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-operation:3306/trip_operations_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8083:8083"
    networks:
      - microservices-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    depends_on:
      - auth-service
      - reservation-service
      - operation-service
    ports:
      - "8080:8080"
    networks:
      - microservices-net

networks:
  microservices-net:
