version: '3.8'

services:
  # MySQL Database for Auth Service
  auth-db:
    image: mysql:8.0
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_password
    ports:
      - "3306:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    networks:
      - vhl-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # MySQL Database for Reservation Service
  reservation-db:
    image: mysql:8.0
    container_name: reservation-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: reservation_db
      MYSQL_USER: reservation_user
      MYSQL_PASSWORD: reservation_password
    ports:
      - "3307:3306"
    volumes:
      - reservation-db-data:/var/lib/mysql
    networks:
      - vhl-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # MySQL Database for Package Service
  package-db:
    image: mysql:8.0
    container_name: package-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: package_db
      MYSQL_USER: package_user
      MYSQL_PASSWORD: package_password
    ports:
      - "3308:3306"
    volumes:
      - package-db-data:/var/lib/mysql
    networks:
      - vhl-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis for Caching
  redis:
    image: redis:7-alpine
    container_name: vhl-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - vhl-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
    depends_on:
      - auth-service
      - reservation-service
    networks:
      - vhl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vhl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Reservation Service
  reservation-service:
    build:
      context: ./reservation-service
      dockerfile: Dockerfile
    container_name: reservation-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://reservation-db:3306/reservation_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVICE_PACKAGE_URL: http://package-service:8083
      SERVICE_AUTH_URL: http://auth-service:8081
    depends_on:
      reservation-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vhl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/reservations/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Package Service (placeholder)
  package-service:
    image: alpine:latest
    container_name: package-service
    command: sleep 1000
    ports:
      - "8083:8083"
    networks:
      - vhl-network

networks:
  vhl-network:
    driver: bridge

volumes:
  auth-db-data:
  reservation-db-data:
  package-db-data:
  redis-data:
