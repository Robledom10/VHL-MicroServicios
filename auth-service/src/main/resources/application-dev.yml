spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://db-auth:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_ID_CLIENT:dummy-id}
            client-secret: ${GOOGLE_SECRET_CLIENT:dummy-sec}
            scope:
              - email
              - profile
google:
  client-id: ${GOOGLE_ID_CLIENT:dummy-id}
  client-secret: ${GOOGLE_SECRET_CLIENT:dummy-sec}

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
