spring:
  profiles:
    active: prod
  datasource:
    url: ${DB_HOST:jdbc:mysql://prod-db:3306/reservation_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:securePassword123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  redis:
    host: ${REDIS_HOST:prod-redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
    timeout: 2000ms

server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    root: WARN
    com.vhl.reservationservice: INFO
    org.springframework: WARN
  file:
    name: /var/log/reservation-service/app.log
    max-size: 50MB
    max-history: 30
    total-size-cap: 10GB

service:
  package:
    url: ${PACKAGE_SERVICE_URL:http://package-service:8083}
  auth:
    url: ${AUTH_SERVICE_URL:http://auth-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
