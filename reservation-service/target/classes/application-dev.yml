spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/reservation_db?useSSL=false&serverTimezone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  redis:
    host: localhost
    port: 6379

server:
  port: 8082

logging:
  level:
    root: INFO
    com.vhl.reservationservice: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

service:
  package:
    url: http://localhost:8081
  auth:
    url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: '*'
