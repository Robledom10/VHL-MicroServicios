spring:
  profiles:
    active: docker
  datasource:
    url: jdbc:mysql://reservation-db:3306/reservation_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  redis:
    host: ${SPRING_REDIS_HOST:redis}
    port: ${SPRING_REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8082}

logging:
  level:
    root: INFO
    com.vhl.reservationservice: INFO
    org.springframework.web: WARN
  file:
    name: /app/logs/reservation-service.log

service:
  package:
    url: ${SERVICE_PACKAGE_URL:http://package-service:8083}
  auth:
    url: ${SERVICE_AUTH_URL:http://auth-service:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
