spring:
  application:
    name: reservation-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vhl_reservas?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:usuario}
    password: ${SPRING_DATASOURCE_PASSWORD:password123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  server:
    port: 8082

server:
  port: 8082
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.hernandolopera.reservation_service: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
