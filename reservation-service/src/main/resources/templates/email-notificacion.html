<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensaje sobre tu reserva</title>
</head>
<body style="margin:0;padding:0;background:#f6fcff;font-family:Arial,sans-serif">

  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f6fcff">
    <tr>
      <td align="center" style="padding:30px 10px">

        <table width="600" cellpadding="0" cellspacing="0"
               style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(18,56,98,0.12);max-width:600px">

          <!-- ══ HEADER ══ -->
          <tr>
            <td style="background:#3fa2db;padding:36px 32px;text-align:center">
              <img src="cid:logo" alt="Hernando Lopera Viajes"
                   style="width:110px;height:110px;display:block;margin:0 auto 16px;object-fit:contain">
              <p style="margin:0 0 4px;color:rgba(255,255,255,0.95);font-size:12px;font-weight:600;letter-spacing:4px;text-transform:uppercase">
                Agencia de Viajes y Excursiones
              </p>
              <h1 style="margin:0;color:#ffffff;font-size:30px;font-weight:800;letter-spacing:0.5px;text-shadow:0 1px 4px rgba(0,0,0,0.15)">
                Hernando Lopera
              </h1>
              <p style="margin:10px 0 0;color:rgba(255,255,255,0.85);font-size:14px">
                Mensaje sobre tu reserva
                <span th:text="${numeroReserva}">#000000</span>
              </p>
            </td>
          </tr>

          <!-- ══ SALUDO Y MENSAJE ══ -->
          <tr>
            <td style="padding:32px 40px">
              <p style="font-size:16px;color:#374151;margin:0">
                Hola <strong th:text="${nombre}">Viajero</strong>,
              </p>
              <p th:utext="${mensajeExtra}"
                 style="font-size:15px;color:#6b7280;margin:16px 0 0;line-height:1.8">
                Mensaje
              </p>
            </td>
          </tr>

          <!-- ══ DETALLES COMPACTOS ══ -->
          <tr>
            <td style="padding:0 40px 32px">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding:8px 0;font-size:13px;color:#6b7280;width:45%">Reserva</td>
                  <td th:text="${numeroReserva}" style="padding:8px 0;font-size:13px;color:#123862;font-weight:600">—</td>
                </tr>
                <tr style="background:#f9fafb">
                  <td style="padding:8px 6px;font-size:13px;color:#6b7280">Paquete</td>
                  <td th:text="${paqueteNombre}" style="padding:8px 6px;font-size:13px;color:#123862;font-weight:600">—</td>
                </tr>
                <tr>
                  <td style="padding:8px 0;font-size:13px;color:#6b7280">Destino</td>
                  <td th:text="${destino}" style="padding:8px 0;font-size:13px;color:#123862;font-weight:600">—</td>
                </tr>
                <tr style="background:#f9fafb">
                  <td style="padding:8px 6px;font-size:13px;color:#6b7280">Fecha de salida</td>
                  <td th:text="${fechaViaje}" style="padding:8px 6px;font-size:13px;color:#123862;font-weight:600">—</td>
                </tr>
                <tr>
                  <td style="padding:8px 0;font-size:13px;color:#6b7280">Estado</td>
                  <td th:text="${estado}" style="padding:8px 0;font-size:13px;color:#3fa2db;font-weight:600">—</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ══ FOOTER ══ -->
          <tr>
            <td style="background:#3fa2db;padding:24px 40px;text-align:center">
              <p style="margin:0;font-size:13px;color:#ffffff;font-weight:600">
                Hernando Lopera Viajes y Excursiones
              </p>
              <p style="margin:6px 0 0;font-size:11px;color:rgba(255,255,255,0.85)">
                © 2026 · hlviajes2026@gmail.com
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
